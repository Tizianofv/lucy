# Freno de mano: la suite de Lucy corre acá antes de que nada llegue a main.
#
# En este repo `push` a main es desplegar a Railway. Hasta hoy las pruebas solo
# corrían si alguien se acordaba: el 31-ago-2026 se publicaron tres cambios con
# todo en verde y uno tumbó la portada del panel.
#
# Lo que este workflow NO cubre, dicho acá para que no se descubra tarde:
#
#   * El corpus de correos bancarios reales (`tests/fixtures/**/*.eml`) son
#     movimientos de Tiziano y de Rosi y está fuera de git (.gitignore:23). Las
#     pruebas que lo necesitan salen SALTADAS con su motivo, nunca en verde.
#     El último paso las lista en el resumen del job.
#   * `tools/humo.py` (acople con la base) necesita DATABASE_URL de producción y
#     no corre acá. Sigue siendo un paso a mano antes de desplegar algo con SQL.
#
# Y una cosa que este workflow SÍ tiene que resolver, porque si no el freno no
# sirve desde fuera: EL LOG DE UNA CORRIDA NO SE PUEDE LEER SIN SER ADMIN
# (`GET /repos/:o/:r/actions/jobs/:id/logs` → 403 aunque el repo sea público;
# comprobado el 4-sep-2026). Por eso el último paso imprime cada prueba en rojo
# como `::error file=…,line=…::…`: eso crea anotaciones en el check run, que sí
# son públicas —`GET /repos/:o/:r/check-runs/:id/annotations` → 200 sin
# autenticar— y salen dibujadas en la página de la corrida. El porqué completo,
# en la cabecera de .github/resumen_pruebas.py.

name: pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          # Una sola fuente de verdad: el mismo .python-version que Railway.
          # Hoy dice 3.12.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar las versiones fijadas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Que lo instalado sea lo fijado
        run: pip check

      - name: Suite
        run: python -m pytest --junitxml=informe.xml

      - name: Qué falló y qué no se pudo probar acá
        if: always()
        run: python .github/resumen_pruebas.py informe.xml
