; Configuración de pytest de Lucy.
;
; Por qué pytest.ini y no pyproject.toml / setup.cfg / tox.ini:
; este repo no es un paquete — se despliega en Railway con Nixpacks a partir de
; requirements.txt. Nixpacks decide cómo instalar mirando qué archivos hay en la
; raíz, y un pyproject.toml puede hacerle cambiar de camino de instalación. En un
; repo donde `push` a main es desplegar a producción, eso es un riesgo que no hace
; falta correr para configurar pytest. setup.cfg y tox.ini tienen el mismo problema:
; significan otra cosa además de pytest. pytest.ini no lo lee nadie más que pytest.
;
; NOTA: que Nixpacks cambie de camino con un pyproject.toml no está verificado
; contra Railway desde acá; es la razón por la que se eligió el lado seguro.

[pytest]
testpaths = tests

; Sin esto, las pruebas `async def` se SALTAN EN SILENCIO y la suite se ve más
; verde de lo que es. Medido el 4-sep-2026 contra 6f7d4da: sin la bandera
; 53 fallos / 300 pasados; con ella, 26 / 327. Son 27 pruebas que no corrían.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

; -ra imprime el motivo de cada saltada al final. Es lo que deja ver en el runner
; la diferencia entre «esto no se puede probar acá» y «esto está roto».
addopts = -ra

; El venv y los cachés de uv viven dentro de la carpeta de trabajo (ver .gitignore).
;
; OJO: esta línea NO se suma a la lista por defecto de pytest, la REEMPLAZA. La
; de pytest 9.1.1 es `*.egg .* _darcs build CVS dist node_modules venv {arch}`,
; así que al escribirla se perdió `venv` (sin punto) — y el árbol desde el que se
; publica tiene justamente una carpeta `venv`. El 6-sep-2026 eso dejó a
; `tests/test_buzon_que_no_se_ve.py` parseando los 9.6 mil .py de los paquetes
; instalados; la suite no terminaba. Acá se re-listan los nombres que hacen falta.
;
; Solo NOMBRES EXACTOS, sin comodines: este campo lo lee también esa guarda, que
; compara nombres, no patrones. Un `.*` acá se leería como una carpeta llamada
; literalmente «.*» y no saltaría ninguna.
;
; Y esta línea NO es la que impide el desastre de arriba. Para pytest, el freno
; de verdad es que ignora los entornos virtuales por su cuenta, mirándoles el
; `pyvenv.cfg` (`_pytest.main._in_venv`, opción `--collect-in-virtualenv`); para
; la guarda, `_py_en_disco`, que mira el mismo archivo. Los nombres de acá son
; cinturón, no fondo.
;
; `node_modules` se sumó el 9-sep-2026, y no es una lista que crece: es un
; nombre que la línea por defecto de pytest YA TRAÍA y que se perdió al
; escribir ésta. Ese día `tests/test_cerrar_varias.py::_py_del_repo` dejó de
; saltar carpetas por su cuenta y pasó a usar la puerta; lo saltaba por nombre
; y acá es donde se dicen los nombres, una vez y para todos.
norecursedirs = .venv venv env .uv-cache .uv-python .pytest_cache .git __pycache__ node_modules
