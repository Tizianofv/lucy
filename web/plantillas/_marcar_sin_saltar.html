{# LA PIEZA ÚNICA de «tocar algo sin que la página se mueva». La incluyen
   (`{% include "_marcar_sin_saltar.html" %}`, dentro de su <script>) TODAS las
   pantallas que la usan: Proyectos (`proyectos.html`, en la sesión de la casa y en
   la de solo ver), la lista de Tareas (`tareas.html`) y el detalle de una tarea
   (`tarea_detalle.html`). Una sola copia: si mañana se cambia, cambia para las
   tres, y `tests/test_tareas_sin_saltar.py` exige que ninguna pantalla escriba su
   propia versión. #}
/* TOCAR ALGO NO MUEVE LA PÁGINA. Todo lo que se toca llega aquí por una sola
   función, `sinSaltar`, que pide la página al servidor por detrás (`fetch`),
   cambia las regiones de la pantalla (`data-region`: en Proyectos la columna de la
   izquierda y el centro, en las pantallas de Tareas el cuerpo) por las que trae la
   respuesta, y devuelve el desplazamiento. Hay tres entradas, todas a esa misma
   función:
     · un formulario (`marcarSinSaltar`): el MISMO POST (o GET) a la misma ruta, que
       escribe y contesta con la misma redirección de siempre; el navegador la sigue
       y baja la página que el servidor decidió mostrar (con sus mismos avisos y sin
       lo que la persona tenía abierto). No hay un segundo pedido ni se calcula nada
       aquí: contadores, dónde queda la tarea y el aviso son los de siempre;
     · un enlace de la propia página (`alHacerClicSinSaltar`): un GET a su dirección;
     · el botón «atrás» del navegador (`alVolverSinSaltar`): un GET a la dirección
       que vuelve a estar en la barra.
   Lo único que se guarda y se devuelve es el desplazamiento de cada región y de la
   ventana, y una fila de referencia (`data-ancla`, la primera que se veía arriba, sin
   contar la tocada si es de las que se mueven): vuelve al mismo sitio de la pantalla.
   Lo que se tocó puede cambiar de contenido (abrirse un detalle, un formulario, un
   aviso); lo que no hace es mover la pantalla lejos de donde la persona estaba.
   Si el pedido ni llega, o el servidor dice que no (401, 4xx), se envía/va de la
   forma de siempre y se ve lo que diga el servidor; si un POST llegó y el servidor
   falló (5xx) NO se reenvía (podría duplicar lo que se guardó): se enseña lo que
   contestó; si el POST contestó bien pero la página no se puede poner (ya se
   guardó), se va a esa misma página con un enlace, SIN reenviar el POST: nunca
   queda una tarea dibujada como hecha sin que lo esté, ni un error sobre algo que
   sí se guardó. */
var turnoSinSaltar = 0, escribiendoSinSaltar = 0, colaSinSaltar = null, vistaSinSaltar = "", raizSinSaltar = "";
function irA(url) { var a = document.createElement("a"); a.href = url; a.click(); }
/* Pinta la página `texto` (la que contestó el servidor a `url`) en lugar de la que
   hay. `ctx.form`: el formulario tocado (si hubo); `ctx.historia`: qué se hace con
   la dirección de la barra («reemplazar» tras guardar, «agregar» al ir a otro sitio,
   «ninguna» al volver con «atrás»); `ctx.vuelta`: el desplazamiento que tenía la
   entrada del historial a la que se vuelve. Lanza si la respuesta no es una
   pantalla como ésta (quien llama va entonces a esa página sin reenviar nada). */
function pintarSinSaltar(url, texto, ctx) {
  var nuevo = new DOMParser().parseFromString(texto, "text/html");
  var viejas = document.querySelectorAll("[data-region]"), nuevas = nuevo.querySelectorAll("[data-region]");
  if (!viejas.length || nuevas.length !== viejas.length) throw new Error("no es esta pantalla");
  var pares = [], i, j, k, hallada, abiertos, lista;
  for (i = 0; i < viejas.length; i++) {
    hallada = null;
    for (j = 0; j < nuevas.length; j++) {
      if (nuevas[j].getAttribute("data-region") === viejas[i].getAttribute("data-region")) hallada = nuevas[j];
    }
    if (!hallada) throw new Error("no es esta pantalla");
    /* Lo que la persona abrió con su dedo (los `<details>` de «N hechas», «N cerrados»)
       sigue abierto tras guardar, si la página trae los mismos: nunca se cierra lo que el
       servidor abrió. Al ir a otra pantalla no se hereda (son otros). */
    abiertos = [];
    if (ctx.historia === "reemplazar") {
      lista = viejas[i].querySelectorAll("details");
      for (k = 0; k < lista.length; k++) abiertos.push(!!lista[k].open);
    }
    pares.push({vieja: viejas[i], nueva: hallada, arriba: viejas[i].scrollTop, abiertos: abiertos});
  }
  var y = window.pageYOffset, x = window.pageXOffset;
  /* Los puntos de referencia: las filas con `data-ancla` (sin contar las que contienen
     otra, ni la tocada si es de las que se mueven, ni una marcada para guardar) que se
     ven arriba de lo que se ve (en pantalla angosta el centro empieza muy arriba de la
     ventana). Al final, la primera que sigue en la página nueva se deja exactamente
     donde estaba (el aviso de arriba y la fila que se va empujarían todo lo demás); si
     ninguna sigue, queda la ventana donde estaba. */
  var tocada = ctx.form && ctx.form.closest ? ctx.form.closest("[data-ancla]") : null;
  var sinMover = ctx.form && ctx.form.classList && ctx.form.classList.contains("marcar") ? tocada : null;
  var filas = document.querySelectorAll("[data-ancla][id]"), anclas = [], f, rf, region, tope;
  for (f = 0; f < filas.length && anclas.length < 8; f++) {
    if (filas[f] === sinMover || filas[f].querySelector("[data-ancla]") ||
        filas[f].querySelector("input:checked:not(:disabled)")) continue;
    region = filas[f].closest("[data-region]");
    tope = Math.max(region ? region.getBoundingClientRect().top : 0, 0);
    rf = filas[f].getBoundingClientRect();
    if (rf.height > 0 && rf.bottom > tope + 4) anclas.push({id: filas[f].id, y: rf.top});
  }
  for (i = 0; i < pares.length; i++) {
    pares[i].puesta = document.importNode(pares[i].nueva, true);
    if (pares[i].abiertos.length) {
      lista = pares[i].puesta.querySelectorAll("details");
      if (lista.length === pares[i].abiertos.length) {
        for (k = 0; k < lista.length; k++) if (pares[i].abiertos[k]) lista[k].open = true;
      }
    }
    pares[i].vieja.replaceWith(pares[i].puesta);
    pares[i].puesta.scrollTop = pares[i].arriba;
  }
  if (nuevo.title) document.title = nuevo.title;
  /* Un guion que la página nueva trae y esta no (el de la carpeta sale solo si el proyecto
     tiene una ruta que copiar) NO correría: está fuera de las regiones y no se cambia.
     Se pone una vez, con su texto. */
  var guion = nuevo.querySelector("#guion-copiar-carpeta");
  if (guion && !document.getElementById("guion-copiar-carpeta")) {
    var s = document.createElement("script");
    s.id = "guion-copiar-carpeta";
    s.textContent = guion.textContent;
    document.body.appendChild(s);
  }
  if (ctx.vuelta) {
    window.scrollTo(ctx.vuelta.x, ctx.vuelta.y);
  } else {
    window.scrollTo(x, y);
    for (i = 0; i < anclas.length; i++) {
      var puesta = document.getElementById(anclas[i].id);
      if (!puesta || !(puesta.getBoundingClientRect().height > 0)) continue;
      var corre = puesta.getBoundingClientRect().top - anclas[i].y;
      var suya = puesta.closest("[data-region]");
      if (suya && suya.scrollHeight > suya.clientHeight) suya.scrollTop += corre;   // pantalla ancha: la región tiene su desplazamiento
      else window.scrollTo(window.pageXOffset, window.pageYOffset + corre);         // si no, es la ventana
      break;
    }
  }
  var donde = new URL(url, window.location.href), destino = donde.pathname + donde.search;
  if (ctx.historia === "agregar" && destino !== vistaSinSaltar) {
    history.replaceState({x: x, y: y}, "");        // la entrada que se deja recuerda dónde estaba la persona
    history.pushState(null, "", destino);
  } else if (ctx.historia !== "ninguna") {
    history.replaceState(null, "", destino);
  }
  vistaSinSaltar = destino;
}
/* Hace UN pedido (`p.url`; con `p.cuerpo` es un POST) y pinta lo que contesta.
   `p.form` es el formulario tocado (o nada, si fue un enlace o «atrás»). Qué pasa con
   cada final:
     · el pedido ni llegó: se envía/va de la forma de siempre (el POST pudo no llegar);
     · 401 u otro 4xx: el servidor no escribió nada, se vuelve a pedir de la forma de
       siempre y se ve lo que diga (la pantalla de entrar si la sesión venció);
     · 5xx a un POST: el servidor lo recibió y falló, NO se reenvía; se enseña lo que dijo;
     · bien, pero otra cosa pidió la persona después: lo viejo no se pinta (solo le pasa a un
       GET: mientras un POST está en camino nada nuevo sale, así que lo guardado siempre se pinta);
     · bien y es el último pedido: se pinta, y si no se puede, se va a esa página sin reenviar.
   Mientras un POST está en camino, un enlace o una búsqueda que se toque espera (el último
   que se toque) y sale cuando el POST termina; otro POST no sale. */
function sinSaltar(p) {
  var esPost = p.cuerpo !== undefined;
  var boton = p.form ? p.form.querySelector("button") : null;
  if (boton) boton.disabled = true;
  var mio = ++turnoSinSaltar, terminado = false;
  if (esPost) escribiendoSinSaltar++;
  var terminar = function () {
    if (terminado) return;
    terminado = true;
    if (esPost) escribiendoSinSaltar--;
    if (p.form && p.form.dataset) delete p.form.dataset.enCamino;
  };
  var despues = function () {
    if (!escribiendoSinSaltar && colaSinSaltar) { var c = colaSinSaltar; colaSinSaltar = null; sinSaltar(c); }
  };
  var normal = function () {
    terminar();
    if (boton) boton.disabled = false;
    if (mio === turnoSinSaltar) { if (p.form) p.form.submit(); else irA(p.url); }   // si la persona ya pidió otra cosa, ésta no la pisa
    despues();
  };
  var respuesta = function (r) {
    if (!r.ok) {
      if (esPost && r.status >= 500) {
        r.text().then(function (texto) { terminar(); document.open(); document.write(texto); document.close(); },
                      function () { terminar(); });
        return;
      }
      normal();
      return;
    }
    r.text().then(function (texto) {
      terminar();
      if (mio !== turnoSinSaltar) { despues(); return; }          // llegó tarde: la persona ya pidió otra cosa (solo un GET puede quedar atrás: nada nuevo sale mientras un POST está en camino)
      try { pintarSinSaltar(r.url, texto, p); } catch (e) { irA(r.url); }
      despues();
    }, function () { terminar(); irA(r.url); despues(); });          // la respuesta buena se cortó: ya se guardó, se va a ella
  };
  var opciones = esPost ? {method: "POST", body: p.cuerpo, credentials: "same-origin"} : {credentials: "same-origin"};
  fetch(p.url, opciones).then(respuesta, normal);
}
/* LA PUERTA ÚNICA de qué se queda en la página: la dirección (ya resuelta) o nada. Un
   GET (enlace, buscador) se queda si va a la MISMA pantalla; un POST, si va a una ruta
   de la raíz de esta pantalla (`/proyectos/...`). Todo lo demás (el menú de arriba,
   «‹ Inicio», otro sitio) sale de la página a propósito: no se toca. */
function destinoSinSaltar(href, metodo) {
  var u;
  try { u = new URL(href, window.location.href); } catch (e) { return null; }
  if (u.origin !== window.location.origin) return null;
  if (metodo === "post") {
    /* (Las pantallas de Tareas no declaran raíz: su formulario marca y ya.) */
    return (raizSinSaltar === "" || u.pathname === raizSinSaltar || u.pathname.indexOf(raizSinSaltar + "/") === 0) ? u : null;
  }
  return u.pathname === window.location.pathname ? u : null;
}
function conLoQueHaceFalta() {
  return typeof window !== "undefined" && !!window.fetch && !!window.URLSearchParams && !!window.DOMParser &&
    !!window.FormData && !!window.history && !!window.history.pushState;
}
/* Los datos del formulario como los envía el navegador, con el botón que lo envió
   (los resultados de la búsqueda de personas y «Quitar el cliente» van en su botón). */
function datosDelFormulario(form, envia) {
  var datos = new URLSearchParams(new FormData(form));
  if (envia && envia.name && !envia.disabled) datos.append(envia.name, envia.value);
  return datos;
}
function marcarSinSaltar(form, envia) {
  var u = destinoSinSaltar(form.action, (form.getAttribute("method") || "get").toLowerCase() === "post" ? "post" : "get");
  if (!u) { form.submit(); return; }
  var datos = datosDelFormulario(form, envia);
  if ((form.getAttribute("method") || "get").toLowerCase() === "post") {
    sinSaltar({url: u.pathname + u.search, cuerpo: datos, form: form, historia: "reemplazar"});
  } else {
    var qs = datos.toString();
    pedirOEsperar({url: u.pathname + (qs ? "?" + qs : ""), form: form, historia: "agregar"});
  }
}
/* Una búsqueda o un enlace (GET) mientras un POST está en camino espera su turno. */
function pedirOEsperar(p) {
  if (escribiendoSinSaltar) {
    if (colaSinSaltar && colaSinSaltar.form && colaSinSaltar.form.dataset) delete colaSinSaltar.form.dataset.enCamino;   // el que se pisa queda libre
    colaSinSaltar = p;
    return;
  }
  sinSaltar(p);
}
/* El oyente de «enviar» de las pantallas que marcan (Tareas): lo registra tal cual
   cada una. Devuelve si se hizo cargo; sin lo que hace falta en el navegador
   (`fetch`, `URLSearchParams`, `DOMParser`) no se hace cargo y el envío es el de
   siempre. Un formulario ya enviado no se vuelve a enviar mientras se espera. */
function alEnviarMarcar(e) {
  var form = e.target;
  if (!form || !form.dataset || !form.classList || !form.classList.contains("marcar")) return false;
  if (typeof window === "undefined" || !window.fetch || !window.URLSearchParams || !window.DOMParser) return false;
  e.preventDefault();
  if (form.dataset.enviado === undefined) {
    form.dataset.enviado = "";
    marcarSinSaltar(form);
  }
  return true;
}
/* LOS OYENTES DE PROYECTOS (una vez por página): todo formulario y todo enlace de la
   pantalla que `destinoSinSaltar` deja pasar se pide por detrás; lo que no, sigue su camino. */
function alEnviarSinSaltar(e) {
  var form = e.target;
  if (e.defaultPrevented || !form || !form.getAttribute || !form.dataset) return;
  var metodo = (form.getAttribute("method") || "get").toLowerCase();
  if (metodo !== "post" && metodo !== "get") return;
  var fuera = form.getAttribute("target");
  if ((fuera && fuera !== "_self") || !destinoSinSaltar(form.action, metodo)) return;
  e.preventDefault();
  if (form.dataset.enCamino !== undefined) return;
  if (metodo === "post" && escribiendoSinSaltar) return;       // otro guardado en camino: éste no sale
  form.dataset.enCamino = "";
  marcarSinSaltar(form, e.submitter);
}
function alHacerClicSinSaltar(e) {
  if (e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
  if (!a) return;
  var fuera = a.getAttribute("target");
  if ((fuera && fuera !== "_self") || a.hasAttribute("download")) return;
  var u = destinoSinSaltar(a.getAttribute("href"), "get");
  if (!u) return;
  var destino = u.pathname + u.search;
  if (a.getAttribute("href").charAt(0) === "#") return;        // un ancla suelta de esta misma pantalla la maneja el navegador
  e.preventDefault();
  pedirOEsperar({url: destino, historia: "agregar"});
}
function alVolverSinSaltar(e) {
  var aqui = window.location.pathname + window.location.search;
  if (aqui === vistaSinSaltar) return;                         // solo cambió el ancla
  pedirOEsperar({url: aqui, historia: "ninguna", vuelta: e && e.state && typeof e.state.y === "number" ? e.state : null});
}
function iniciarSinSaltos(raiz) {
  if (!conLoQueHaceFalta()) return;
  raizSinSaltar = raiz;
  vistaSinSaltar = window.location.pathname + window.location.search;
  document.addEventListener("submit", alEnviarSinSaltar);
  document.addEventListener("click", alHacerClicSinSaltar);
  window.addEventListener("popstate", alVolverSinSaltar);
}
