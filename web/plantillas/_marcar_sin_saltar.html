{# LA PIEZA ÚNICA de «tocar algo sin que la página se mueva». La incluyen
   (`{% include "_marcar_sin_saltar.html" %}`, dentro de su <script>) TODAS las
   pantallas que la usan: Proyectos (`proyectos.html`, en la sesión de la casa y en
   la de solo ver), la lista de Tareas (`tareas.html`) y el detalle de una tarea
   (`tarea_detalle.html`). Una sola copia: si mañana se cambia, cambia para las
   tres, y `tests/test_tareas_sin_saltar.py` exige que ninguna pantalla escriba su
   propia versión. #}
/* TOCAR ALGO NO MUEVE LA PÁGINA. Todo lo que se toca llega aquí por una sola
   función, `sinSaltar`, que pide la página al servidor por detrás (`fetch`),
   cambia las regiones de la pantalla (`data-region`: en Proyectos la columna de la
   izquierda y el centro, en las pantallas de Tareas el cuerpo) por las que trae la
   respuesta, y devuelve el desplazamiento. Hay tres entradas, todas a esa misma
   función:
     · un formulario (`marcarSinSaltar`): el MISMO POST (o GET) a la misma ruta, con
       los mismos campos y el botón que lo envió; escribe y contesta con la misma
       redirección de siempre; el navegador la sigue y baja la página que el servidor
       decidió mostrar. No hay un segundo pedido ni se calcula nada aquí;
     · un enlace de la propia página (`alHacerClicSinSaltar`): un GET a su dirección;
     · el botón «atrás» del navegador (`alVolverSinSaltar`): un GET a la dirección
       que vuelve a estar en la barra.

   ventana, y una fila de referencia (`data-ancla`).

   UN GUARDADO SE MANDA UNA SOLA VEZ, pase lo que pase. Qué pasa con cada final:
     · un GET (enlace, búsqueda, «atrás») que no llega o falla: se hace de la forma de
       siempre (no duplica nada);
     · un POST que no llegó respuesta, o que el servidor contestó 5xx: NO se reenvía (pudo
       guardarse); la persona lee, dentro de la página y sin perder lo que escribió, que no
       hay confirmación, con un enlace para mirar cómo quedó. Reintentar es cosa de ella;
     · un POST que el servidor rechazó con 4xx (401: la sesión venció): no escribió nada, así
       que se envía de la forma de siempre, con el botón que lo envió (`requestSubmit`);
       si el formulario ya no está en la página (salió de la cola y se repintó), se avisa;
     · un POST que contestó bien pero la página no se puede poner: se va a esa misma página
       con un enlace, SIN reenviar. (El aviso de «guardado» se gastó en la lectura de por
       detrás: esa página llega sin el aviso, nunca con uno falso.)
   NADA DE LO QUE LA PERSONA HACE SE TRAGA: un guardado que llega mientras otro va en camino
   se arma con lo que tenía en ese momento y sale después, en orden, una vez. Al repintar
   tras un guardado, lo que se estaba escribiendo en otro campo vuelve a su sitio (con el
   foco), salvo en los formularios que ya van en camino. */
var turnoSinSaltar = 0, escribiendoSinSaltar = 0, colaSinSaltar = [], vistaSinSaltar = "", raizSinSaltar = "", avisoSinSaltar = null;

/* Lo que sigue solo lo hace la pantalla de Proyectos (`iniciarSinSaltos`); las de Tareas

  avisoSinSaltar = null;
}
/* El aviso de «sin confirmar»: va FUERA de las regiones (no se borra al repintar), siempre a la
   vista (fijo en el borde de arriba), y con un enlace a esta misma vista para mirar cómo quedó. */
function avisarSinSaltar(texto) {

function llavesDeCampos(regiones) {

      k = ((c.form.getAttribute("action") || "").split("?")[0]) + "|" + c.name;

/* Pinta la página `texto` (la que contestó el servidor a `url`) en lugar de la que

  /* Un guion que la página nueva trae y esta no (el de la carpeta sale solo si el proyecto

  var guion = nuevo.querySelector("#guion-copiar-carpeta");

  } else {
    window.scrollTo(x, y);

      var puesta = document.getElementById(anclas[i].id);

      var corre = puesta.getBoundingClientRect().top - anclas[i].y;
      var suya = puesta.closest("[data-region]");

/* El envío de siempre del navegador, con EXACTAMENTE lo que llevaría: el botón que lo envió
