{#- Las clases de las pantallas de Facturas (pieza 4, 21-oct-2026). Se usan en `facturas.html`, `factura_nueva.html` y
    `factura.html`. Solo estilo: ningún texto sale de acá. Las variables son las de `base.html`. -#}
{% macro estilo_de_facturas() -%}
<style>
main a:not(.boton):not(.boton-linea):not([class*=cz]){color:var(--acento)}
textarea{font:inherit;padding:.45rem .6rem;border-radius:7px;border:1px solid var(--linea);background:var(--fondo);color:var(--texto)}
.enc{display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem}
.enc h1{margin:0}
a.boton,a.boton-linea{display:inline-block;border-radius:7px;padding:.45rem .8rem;text-decoration:none;font-size:.94rem}
a.boton{background:var(--acento);color:#fff}
a.boton-linea{border:1px solid var(--linea);color:var(--texto);background:var(--papel)}
button.linea{background:var(--papel);color:var(--texto);border:1px solid var(--linea)}
button.peligro{background:var(--gasto)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1rem}
.chips a{border:1px solid var(--linea);border-radius:99px;padding:.2rem .75rem;color:var(--suave);text-decoration:none;font-size:.88rem}
.chips a.on{background:var(--acento);color:#fff;border-color:var(--acento)}
.pild{display:inline-block;border-radius:99px;padding:.1rem .6rem;font-size:.78rem;border:1px solid var(--linea)}
.pild.emitida{background:var(--ingreso);color:#fff;border-color:var(--ingreso)}
.pild.anulada{background:var(--gasto);color:#fff;border-color:var(--gasto)}
.pild.borrador{color:var(--suave)}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem;margin:.8rem 0}
.campos label{display:flex;flex-direction:column;gap:.2rem;font-size:.86rem;color:var(--suave)}
.campos input[type=text],.campos input[type=date],.campos textarea{width:100%}
.campos label.marcada input,input[aria-invalid="true"],textarea[aria-invalid="true"]{border:2px solid var(--gasto)}
label.casilla{flex-direction:row;align-items:center;gap:.5rem;color:var(--texto)}
table.reng td{padding:.3rem .4rem}
table.reng input,table.reng textarea{width:100%}
table.reng textarea{min-height:2.4rem}
.sesion{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--linea)}
.sesion .que{flex:1}
.sesion .cod{color:var(--suave);margin-left:.4rem;font-size:.86rem}
.etiq{display:inline-block;border-radius:5px;padding:0 .4rem;font-size:.76rem;border:1px solid var(--linea);color:var(--suave);margin-left:.3rem}
.pie-guardar{position:sticky;bottom:0;background:var(--papel);border-top:1px solid var(--linea);padding:.7rem 0;margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.pie-guardar .aviso{margin:0;flex:1 1 100%}
.dos{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.2rem;align-items:start}
@media(max-width:52rem){.dos{grid-template-columns:1fr}}
.acciones{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.acciones form{margin:0}
dl.datos{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.4rem 0;font-size:.92rem}
dl.datos dt{color:var(--suave)}
dl.datos dd{margin:0}
.confirma{border:1px solid var(--gasto);border-radius:10px;padding:.8rem 1rem;margin:.8rem 0;background:var(--papel)}
.confirma form{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.confirma textarea{width:100%}
.hoja-caja{overflow-x:auto}
</style>
{%- endmacro %}
