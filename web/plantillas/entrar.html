<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzas</title><style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf9f7;
      color:#1a1a1a;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}
 @media(prefers-color-scheme:dark){body{background:#16181c;color:#e8e6e3}}
 .caja{max-width:26rem;padding:2rem;text-align:center}
 .mal{color:#b3261e}
</style></head><body><div class="caja">
<h1>Panel de finanzas</h1>
{% if error %}<p class="mal">Ese enlace ya venció o no es válido.</p>{% endif %}
<p>Pedile el enlace a Lucy por Telegram escribiéndole <b>«dame el panel»</b>.</p>
<p style="color:#6b6b6b;font-size:.9rem">Los enlaces duran 10 minutos.
No hay contraseña que recordar: quien puede preguntarle a Lucy cuánto gastó es
quien puede entrar acá.</p>
</div></body></html>
